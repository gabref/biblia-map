[workspace]
members = [
   "crates/bibliamap-core",
   "crates/bibliamap-extractor",
   "crates/jwpub-reader",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "=1.0.100"
chrono = { version = "=0.4.42", default-features = false, features = [ "clock", "serde" ] }
clap = { version = "=4.5.51", features = [ "derive" ] }
rusqlite = { version = "=0.32.1", features = [ "bundled" ] }
scraper = "=0.24.0"
serde = { version = "=1.0.228", features = [ "derive" ] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
thiserror = "=1.0.69"
zip = "=2.4.2"
reqwest = { version = "=0.12.24", default-features = false, features = [ "blocking", "rustls-tls" ] }
