[workspace]
members = [
   "crates/bibliamap-core",
   "crates/bibliamap-extractor",
   "crates/jwpub-reader",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "=1.0.105"
chrono = { version = "=0.4.45", default-features = false, features = [ "clock", "serde" ] }
clap = { version = "=4.6.10", features = [ "derive" ] }
rusqlite = { version = "=0.43.0", features = [ "bundled" ] }
scraper = "=0.29.0"
serde = { version = "=1.0.229", features = [ "derive" ] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
zip = "=9.8.2"
reqwest = { version = "=0.13.5", default-features = false, features = [ "blocking", "rustls" ] }
