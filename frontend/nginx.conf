server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/manifest+json
        application/xml+rss
        image/svg+xml;

    # `add_header` in a location replaces every header inherited from this level, so the
    # security headers are repeated in each location below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The SPA shell must always be revalidated: it references content-hashed /assets/ files that
    # are deleted on every deploy. Without an explicit Cache-Control, browsers cache it
    # heuristically from Last-Modified and can keep loading a shell whose assets 404.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        # Client-side routes (/chord, /verse, ...) fall back to the shell via the location above.
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        access_log off;
        # `expires` already emits Cache-Control: max-age; adding a second Cache-Control header
        # produced "max-age=..., public, max-age=...". Set the header once.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /generated/ {
        access_log off;
        # Generated JSON is not content-hashed, so keep the lifetime short. No `always` on
        # Cache-Control here or in /assets/: a 404 must not be cached for an hour or a year.
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
