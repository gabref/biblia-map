    <rect x="3" y="3" width="506" height="506" rx="109" stroke="#e9ebef" stroke-opacity=".1" stroke-width="6"/>
  </g>
  <g id="glyph">
    <path d="M198 250A86 43 0 0 1 198 336" stroke="#e2b44c" stroke-width="14" stroke-linecap="round"/>
    <path d="M198 112A118 69 0 0 1 198 250A148 78 0 0 1 198 406" stroke="#8faef5" stroke-width="42" stroke-linejoin="round"/>
    <path d="M198 78V434" stroke="#e9ebef" stroke-width="42"/>
    <rect x="152" y="223" width="92" height="54" rx="8" fill="#f0705a"/>
  </g>
</svg>
